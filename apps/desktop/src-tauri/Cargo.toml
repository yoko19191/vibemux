[package]
name = "vibemux-desktop"
version = "1.2.3"
edition = "2021"
authors = ["CGH <yoko19191@github.com>"]
description = "A keyboard-first terminal multiplexer for vibe coding"
homepage = "https://github.com/yoko19191/vibemux"
repository = "https://github.com/yoko19191/vibemux"

[lib]
name = "vibemux_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
portable-pty = "0.9"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
bytes = { version = "1", features = ["serde"] }
thiserror = "1"
log = "0.4"
which = "7"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "winnt", "handleapi"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
